<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/icons/r/practions-r-64.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Practions 線上題庫測驗平台，隨時隨地練習、即時評分。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://practions.web.app/" />
  <meta property="og:title" content="Practions" />
  <meta property="og:description" content="線上題庫測驗平台，隨時隨地練習、即時評分。" />
  <meta property="og:image" content="https://practions.web.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+TC:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />


  <!-- apple-touch-icon -->
  <link rel="apple-touch-icon" sizes="152x152"
    href="/icons/apple-touch-icon/apple-touch-icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="144x144"
    href="/icons/apple-touch-icon/apple-touch-icon-144x144.png" />
  <link rel="apple-touch-icon" sizes="120x120"
    href="/icons/apple-touch-icon/apple-touch-icon-120x120.png" />
  <link rel="apple-touch-icon" sizes="114x114"
    href="/icons/apple-touch-icon/apple-touch-icon-114x114.png" />
  <link rel="apple-touch-icon" sizes="72x72" href="/icons/apple-touch-icon/apple-touch-icon-72x72.png" />

  <link rel="stylesheet" href="/theme.css" />
  <link rel="manifest" href="/manifest.json" />

  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      display: inline-block;
      letter-spacing: 0;
      line-height: 1;
      font-size: 1.5rem;
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }

    .material-symbols-outlined.fill {
      font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }

    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      display: inline-block;
      letter-spacing: 0;
      line-height: 1;
      font-size: 1.5rem;
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }

    .material-symbols-rounded.fill {
      font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }

    /* 首屏：JS 載入前就顯示，至少停留一段時間後由 index.tsx 加上 .hide 淡出 */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--background-color, #ffffff);
      transition: opacity 0.5s ease;
    }

    /* 圖示與名稱預先合成為一張圖（3 倍解析度），避免字體晚載入導致文字變化；固定寬度、高度依比例 */
    .splash img {
      width: 139px;
      height: auto;
      transition: transform 0.5s ease;
    }

    /* 只有從主畫面開啟（PWA）才顯示首屏 */
    @media not all and (display-mode: standalone) {
      .splash {
        display: none;
      }
    }

    .splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash.hide img {
      transform: scale(1.15);
    }
  </style>

  <title>Practions</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <div class="splash">
    <img src="/splash.png" width="414" height="441" alt="Practions" />
  </div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
